# Build once, deploy to staging.
#
# Runs on main. Every CI gate must pass first. Images are built a single time
# and referenced by digest from then on; production promotes that same digest
# (see deploy-production.yml) and never rebuilds.
#
# Nothing here runs until the repository variables below exist, so a fresh
# clone or fork stays green without any cloud account:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT
# and, for the UI: CLOUDFLARE_PAGES_PROJECT, CLOUDFLARE_ACCOUNT_ID.
# Secrets (environment "staging"): DATABASE_URL, CLOUDFLARE_API_TOKEN.
#
# Authentication to Google Cloud uses GitHub OIDC + Workload Identity
# Federation. There is no service-account key anywhere.
name: Deploy (staging)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never interrupt a deploy halfway

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    needs: verify
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived GCP credentials
    outputs:
      api_image: ${{ steps.refs.outputs.api }}
      worker_image: ${{ steps.refs.outputs.worker }}
    env:
      REPOSITORY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/relay-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REPOSITORY }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.REPOSITORY }}/worker:${{ github.sha }}
          cache-from: type=gha
      - id: refs
        name: Record immutable image references
        run: |
          echo "api=${REPOSITORY}/api@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "worker=${REPOSITORY}/worker@${{ steps.worker.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images built"
            echo "Promote these exact digests to production with the *Deploy (production)* workflow:"
            echo '```'
            echo "api:    ${REPOSITORY}/api@${{ steps.api.outputs.digest }}"
            echo "worker: ${REPOSITORY}/worker@${{ steps.worker.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Migrate, deploy and smoke-test staging
    needs: build
    uses: ./.github/workflows/release.yml
    with:
      environment: staging
      api_image: ${{ needs.build.outputs.api_image }}
      worker_image: ${{ needs.build.outputs.worker_image }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy-web:
    name: Deploy web UI to Cloudflare Pages
    needs: deploy-staging
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
