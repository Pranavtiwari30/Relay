[project]
name = "relay-core"
version = "0.1.0"
description = "Relay domain, persistence, messaging, adapters and investigation logic"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "argon2-cffi>=23.1",
    "mcp>=1.2",
]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.27", "google-auth>=2.35", "requests>=2.32"]
# Optional hosted-model slot for the investigation assistant. Never needed for event processing.
anthropic = ["anthropic>=1.0"]

[project.scripts]
relay-migrate = "relay_core.db.migrate:main"
relay-mcp = "relay_core.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_core"]
