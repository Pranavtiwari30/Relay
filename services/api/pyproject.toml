[project]
name = "relay-api"
version = "0.1.0"
description = "Relay control plane and webhook ingestion API"
requires-python = ">=3.11"
dependencies = ["relay-core[gcp,anthropic]", "fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_api"]

[tool.uv.sources]
relay-core = { workspace = true }
