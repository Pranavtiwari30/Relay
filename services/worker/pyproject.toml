[project]
name = "relay-worker"
version = "0.1.0"
description = "Relay delivery worker and outbox dispatcher"
requires-python = ">=3.11"
dependencies = ["relay-core[gcp]", "fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_worker"]

[tool.uv.sources]
relay-core = { workspace = true }
